name: Marketing scan

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reddit-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Reddit opportunity scan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEVTALK_URL: https://provinica.ch/devtalk
          GAME_URL: https://provinica.ch
        run: pnpm reddit:scan

      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/reddit-opportunities.md
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update Reddit opportunity scan"
            git push
          fi
